# Valores de exemplo. Usuários, senhas e webhook ficam no .env (ver .env.example).

local:
  base_dir: "data"
  logs_dir: "data/logs"

origem:
  host: "backup.example.com"
  port: 21
  protocol: "ftp"                # "ftp" ou "sftp"
  remote_dir: "/backups/export"
  retention_count: 3             # Quantidade de datas de export mais recentes a manter na origem
  filename_prefix: "EXPORT"      # Prefixo dos arquivos, ex: EXPORT_VENDAS_PROD_20260902_1.dmp.gz
  filename_infix: "PROD"         # Infixo entre a sigla do sistema e a data

oracle:
  host: "oracle-db.example.internal"
  port: 22
  import_dir: "/backup/import"
  rman_dir: "/backup/rman"
  min_disk_free_gb: 15           # Espaço mínimo livre antes de acionar limpeza de RMAN

impdp:
  tns: "ORCLPDB"
  timeout_seconds: 18000         # 5 horas (bases grandes)
  log_prefix: "impdp"            # Prefixo dos logs gerados pelo impdp, ex: impdp_vendas_....log

sistemas:
  # na ordem de execução
  ativos:
    - "VENDAS"
    - "COMPRAS"
    - "ESTOQUE"
    - "FINANCEIRO"
    - "RH"
    - "LOGISTICA"

teste:
  sufixo: "_teste"               # usado só com --teste, nos arquivos enviados ao Oracle e no log do impdp

alertas:
  responsavel: "equipe de DBA"
  # Erros que não barram a importação (código ou trecho exato de mensagem)
  ignorar_ora_erros:
    - "ORA-31684"  # Objeto já existe
    - "ORA-39111"  # Objeto dependente já existe e foi ignorado
    - "ORA-39146"  # Schema não existe no remap_schema
    - "ORA-01917"  # Usuário ou papel não existe (grants de produção)
    - "ORA-01918"  # Usuário não existe (grants de produção)
    - "ORA-01919"  # Role não existe (grants de produção)
    - "ORA-02380"  # Profile não existe (grants de produção)
    - "ORA-00942"  # Tabela ou view não existe (dependências entre schemas)
  ignorar_ora_erros_por_sistema: {}   # ex.: { "ESTOQUE": ["ORA-02000"] }
